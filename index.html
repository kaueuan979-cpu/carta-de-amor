<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envelope Interativo - Eu Te Amo</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --env-outer: #ff4d6d;
      --env-inner: #ff758f;
      --env-dark: #c9184a;
      --letter-bg: #fff0f3;
      --text-color: #590d22;
      --shadow-color: rgba(255, 77, 109, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #2d0036 0%, #0d001a 100%);
      overflow: hidden;
      perspective: 1000px;
    }

    /* Contêiner principal do Envelope */
    .envelope-wrapper {
      position: relative;
      width: 320px;
      height: 220px;
      cursor: pointer;
    }

    .envelope {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--env-dark);
      border-radius: 0 0 12px 12px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 25px var(--shadow-color);
    }

    /* Carta interna */
    .letter {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 190px;
      background: var(--letter-bg);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      z-index: 2;
      transition: transform 0.5s ease, z-index 0.5s ease;
    }

    .letter h1 {
      font-family: "Dancing Script", cursive, sans-serif;
      font-size: 2.2rem;
      color: var(--text-color);
      margin-bottom: 8px;
    }

    .letter p {
      font-family: "Montserrat", sans-serif;
      font-size: 0.85rem;
      color: #800f2f;
      line-height: 1.4;
    }

    /* Dobras do envelope (Laterais e Fundo) */
    .pocket-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 110px 0 110px 160px;
      border-color: transparent transparent transparent var(--env-inner);
      z-index: 3;
      border-bottom-left-radius: 12px;
    }

    .pocket-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 110px 160px 110px 0;
      border-color: transparent var(--env-inner) transparent transparent;
      z-index: 3;
      border-bottom-right-radius: 12px;
    }

    .pocket-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 160px 125px 160px;
      border-color: transparent transparent var(--env-outer) transparent;
      z-index: 4;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    /* Aba superior (Flap 3D) */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 125px 160px 0 160px;
      border-color: var(--env-dark) transparent transparent transparent;
      transform-origin: top;
      transition: transform 0.4s ease-in-out, z-index 0.2s ease-in-out;
      z-index: 5;
    }

    /* Selo de coração na ponta da aba */
    .seal {
      position: absolute;
      top: -125px;
      left: -15px;
      width: 30px;
      height: 30px;
      background: #800f2f;
      clip-path: path("M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z");
      transform: scale(1.2);
    }

    /* Estados de Animação no Hover / Toque */
    .envelope-wrapper:hover .flap,
    .envelope-wrapper:active .flap {
      transform: rotateX(180deg);
      z-index: 1;
      transition-delay: 0s;
    }

    .envelope-wrapper:hover .letter,
    .envelope-wrapper:active .letter {
      transform: translateX(-50%) translateY(-110px);
      z-index: 6;
      transition-delay: 0.25s;
    }

    /* Suporte a preferência por menos movimento */
    @media (prefers-reduced-motion: reduce) {
      .flap, .letter {
        transition: none;
      }
    }
  </style>
</head>
<body>

  <div class="envelope-wrapper">
    <div class="envelope">
      
      <!-- Aba que dobra em 3D -->
      <div class="flap">
        <div class="seal"></div>
      </div>

      <!-- Carta com a mensagem -->
      <div class="letter">
        <h1>Eu Te Amo</h1>
        <p>Você é a razão dos meus melhores sorrisos todos os dias. ❤️</p>
      </div>

      <!-- Bolsos que formam a frente do envelope -->
      <div class="pocket-left"></div>
      <div class="pocket-right"></div>
      <div class="pocket-bottom"></div>

    </div>
  </div>

</body>
</html>
